name: Feature request
description: Suggest an improvement to CycloneAid.
title: "[Feature]: "
labels: [feature, "priority:normal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe what is difficult today and who would benefit from the change.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What would you like to happen?
      description: Give an example of how the feature should work. Mention alternatives or limits if they matter.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the results we should check to know the feature works.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Related work or dependencies
      description: Link anything that needs to happen first, or write "None known."
    validations:
      required: true
