name: Bug report
description: Report a reproducible problem in CycloneAid.
title: "[Bug]: "
labels: [bug, "priority:normal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us which project or sample you opened, what you did, and which settings you used.
      placeholder: |
        1. Choose Project → Open sample.
        2. ...
        Chart maps: Full maps / Without basemap
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Find the application version under Help → About and release notes. Include your operating system, Python version, and how you installed CycloneAid.
      placeholder: |
        CycloneAid version:
        Operating system:
        Python version:
        Installation: setup script / uv / pip
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error, logs, or example input
      description: Include the exact error and relevant log lines, or attach a small project/CSV and a screenshot. For chart problems, include the times, coordinates, winds, and wind averaging assumption.
  - type: textarea
    id: dependencies
    attributes:
      label: Related reports
      description: Link any related issue, or leave this blank.
