name: Verify CycloneAid
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        desktop: [false, true]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      CYCLONEAID_GUI_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --locked
        if: ${{ !matrix.desktop }}
      - run: uv sync --locked --extra desktop
        if: ${{ matrix.desktop }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python tools/check_release.py
      - run: uv export --locked --extra desktop --no-dev --no-emit-project --no-header --output-file requirements.check.txt
      - run: uv run --no-sync python -c "from pathlib import Path; assert Path('requirements.txt').read_text() == Path('requirements.check.txt').read_text()"
  gui:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      CYCLONEAID_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: uv sync --locked --extra desktop
      - run: xvfb-run -a uv run --no-sync python -m unittest discover -s tests -v
